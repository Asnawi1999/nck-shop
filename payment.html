
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCK SHOP - Payment</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 520px;
  margin: 30px auto;
  padding: 25px;
  border: 1px solid #00ff66;
  border-radius: 16px;
  background: #101010;
}

.logo {
  text-align: center;
  color: #00ff66;
  font-size: 27px;
  font-weight: bold;
}

h2 {
  text-align: center;
}

.section {
  border: 1px solid #00ff66;
  border-radius: 10px;
  padding: 15px;
  margin-top: 18px;
}

p {
  color: #ccc;
  line-height: 1.6;
}

.total {
  color: #00ff66;
  font-size: 25px;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  border: none;
  border-radius: 9px;
  background: #00ff66;
  color: black;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.back {
  display: block;
  text-align: center;
  color: #00ff66;
  margin-top: 20px;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">NCK SHOP</div>

  <h2>SECURE PAYMENT</h2>

  <div class="section">
    <h3>Order Summary</h3>
    <p id="product">Loading order...</p>
    <p id="customer"></p>
    <p class="total" id="total">RM 0.00</p>
  </div>

  <div class="section">
    <h3>Payment Method</h3>
    <p>ABA PAYWAY</p>
    <p>Secure online payment gateway.</p>
    <p>Visa / Mastercard / supported payment methods depend on your ABA merchant account.</p>
  </div>

  <button onclick="payNow()">
    PAY NOW
  </button>
  
  <a href="https://link.payway.com.kh/ABAPAYt35707895"
   style="display:block;text-align:center;
   background:#00ff66;color:black;
   padding:15px;border-radius:9px;
   text-decoration:none;font-weight:bold;
   margin-top:20px;">
   PAY NOW
</a>

  <a class="back" href="shop.html">Back to Shop</a>

</div>

<script>
const order = JSON.parse(
  localStorage.getItem("nck_order") || "null"
);

if (order) {
  document.getElementById("product").textContent =
    (order.items || []).map(item =>
      item.name + " - " + item.size + " x " + item.qty
    ).join(", ");

  document.getElementById("customer").textContent =
    "Customer: " + (order.name || "");

  document.getElementById("total").textContent =
    "Total: " + (order.total || 0);
} else {
  document.getElementById("product").textContent =
    "No order found.";
}

function payNow() {
  alert(
    "ABA PAYWAY integration is not activated yet. " +
    "A secure payment server and ABA merchant credentials are required."
  );
}
</script>

</body>
</html>
