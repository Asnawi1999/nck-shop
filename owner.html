
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner Login | NCK SHOP</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080b09;
 color:white;
 font-family:Arial,sans-serif;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.login{
 width:100%;
 max-width:400px;
 background:#111a13;
 border:1px solid #24402d;
 border-radius:15px;
 padding:30px;
}
.logo{
 text-align:center;
 font-size:30px;
 font-weight:bold;
 color:#39e879;
}
h2{text-align:center}
p{
 text-align:center;
 color:#999;
 font-size:14px;
 line-height:1.6;
}
label{
 display:block;
 margin:18px 0 8px;
}
input{
 width:100%;
 padding:14px;
 background:#080b09;
 color:white;
 border:1px solid #315b3d;
 border-radius:7px;
}
button{
 width:100%;
 padding:15px;
 background:#39e879;
 border:0;
 border-radius:7px;
 font-weight:bold;
 margin-top:22px;
}
a{
 display:block;
 text-align:center;
 color:#39e879;
 margin-top:22px;
 text-decoration:none;
}
.notice{
 margin-top:20px;
 padding:12px;
 background:#202b20;
 border-radius:8px;
 color:#d7e5d9;
 font-size:12px;
 line-height:1.6;
}
</style>
</head>
<body>

<div class="login">
<div class="logo">NCK SHOP</div>
<h2>OWNER LOGIN</h2>
<p>Private access for shop owner</p>

<form onsubmit="loginNotice(event)">
<label>Email Pemilik</label>
<input type="email" id="email"
placeholder="Owner email" required>

<label>Password</label>
<input type="password" id="password"
placeholder="Password" required>

<button type="submit">LOGIN</button>
</form>

<div class="notice">
Sistem login belum diaktifkan. Sambungan pengesahan pemilik yang selamat perlu disediakan sebelum halaman ini digunakan.
</div>

<a href="index.html">Kembali ke Home</a>
</div>

<script>
function loginNotice(event){
 event.preventDefault();
 alert("Login belum diaktifkan. Sistem keselamatan pemilik perlu disediakan dahulu.");
}
</script>

</body>
</html>
