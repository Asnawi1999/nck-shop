
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout | NCK SHOP</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b09;color:white;font-family:Arial}
header{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #24402d}
.logo{font-size:24px;font-weight:bold;color:#39e879}
nav a{color:white;text-decoration:none;margin-left:12px}
main{max-width:650px;margin:40px auto;padding:20px}
h1{color:#39e879}
.box{background:#111a13;border:1px solid #24402d;padding:22px;border-radius:12px}
label{display:block;margin-top:17px;margin-bottom:7px}
input,textarea,select{width:100%;padding:13px;background:#080b09;color:white;border:1px solid #315b3d;border-radius:7px;font-size:15px}
textarea{height:90px}
button{width:100%;padding:15px;background:#39e879;color:#071009;border:0;border-radius:7px;font-weight:bold;margin-top:22px}
.summary{border-top:1px solid #315b3d;margin-top:20px;padding-top:15px}
footer{text-align:center;color:#777;padding:25px}
</style>
</head>
<body>
<header>
<div class="logo">NCK SHOP</div>
<nav>
<a href="index.html">Home</a>
<a href="shop.html">Shop</a>
<a href="cart.html">Cart</a>
</nav>
</header>

<main>
<h1>CHECKOUT</h1>
<p>Isi maklumat penghantaran anda.</p>

<div class="box">
<form onsubmit="placeOrder(event)">

<label>Nama penuh</label>
<input id="name" type="text" required placeholder="Nama pelanggan">

<label>Nombor telefon</label>
<input id="phone" type="tel" required placeholder="Contoh: 01XXXXXXXX">

<label>Alamat penghantaran</label>
<textarea id="address" required placeholder="Alamat penuh"></textarea>

<label>Kaedah pembayaran</label>
<select id="payment">
<option>Bank Transfer</option>
<option>Cash On Delivery (COD)</option>
</select>

<div class="summary">
<h3>Jumlah pesanan</h3>
<strong id="total">RM 0.00</strong>
</div>

<button type="submit">CONFIRM ORDER</button>
</form>
</div>
</main>

<footer>© 2026 NCK SHOP</footer>

<script>
function getCart(){
return JSON.parse(localStorage.getItem("nck_cart")||"[]");
}

function showTotal(){
let cart=getCart();
let total=cart.reduce((sum,item)=>sum+item.price*item.qty,0);
document.getElementById("total").innerText="RM "+total.toFixed(2);
}

function placeOrder(event){
event.preventDefault();

let cart=getCart();

if(cart.length===0){
alert("Cart anda kosong. Sila pilih produk dahulu.");
location.href="shop.html";
return;
}

let order={
name:document.getElementById("name").value,
phone:document.getElementById("phone").value,
address:document.getElementById("address").value,
payment:document.getElementById("payment").value,
cart:cart,
total:cart.reduce((sum,item)=>sum+item.price*item.qty,0)
};

localStorage.setItem("nck_order",JSON.stringify(order));

location.href="payment.html";
}

showTotal();
</script>
</body>
</html>
