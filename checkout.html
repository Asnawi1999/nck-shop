
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout | NCK SHOP</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;background:#080808;
 color:white;font-family:Arial,sans-serif
}
.container{
 max-width:600px;margin:20px auto;padding:25px;
 background:#151515;border:1px solid #00ff66;
 border-radius:16px
}
.logo{text-align:center;color:#00ff66;font-size:28px;font-weight:bold}
h2{text-align:center}
label{display:block;margin:15px 0 7px;color:#00ff66;font-size:14px}
input,select,textarea{
 width:100%;padding:13px;background:#080808;
 color:white;border:1px solid #444;border-radius:8px;
 font-size:16px
}
textarea{min-height:80px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.summary{background:#080808;padding:15px;border-radius:10px;margin-top:20px}
.total{color:#00ff66;font-size:23px;font-weight:bold}
button{
 width:100%;padding:16px;margin-top:22px;
 background:#00ff66;color:black;border:0;
 border-radius:8px;font-size:16px;font-weight:bold
}
.back{display:block;text-align:center;color:#00ff66;margin-top:20px;text-decoration:none}
@media(max-width:450px){.grid{grid-template-columns:1fr}}
</style>
</head>

<body>
<div class="container">

<div class="logo">NCK SHOP</div>
<h2>CHECKOUT</h2>

<form id="checkoutForm">

<label>Nama Penuh</label>
<input id="name" required placeholder="Nama penerima">

<label>Nombor Telefon</label>
<input id="phone" type="tel" required placeholder="+60 12 345 6789">

<label>Email</label>
<input id="email" type="email" required placeholder="nama@email.com">

<label>Negara</label>
<select id="country" required>
<option value="">Pilih negara</option>
<option value="Malaysia">Malaysia</option>
<option value="Cambodia">Cambodia</option>
<option value="Singapore">Singapore</option>
<option value="Thailand">Thailand</option>
<option value="Indonesia">Indonesia</option>
<option value="Brunei">Brunei</option>
<option value="Other">Other</option>
</select>

<label>Alamat Jalan / Rumah</label>
<input id="street" required placeholder="No rumah, nama jalan">

<label>Apartment / Unit (Jika ada)</label>
<input id="unit" placeholder="Apartment, tingkat, unit">

<div class="grid">
<div>
<label>Bandar</label>
<input id="city" required placeholder="Bandar">
</div>
<div>
<label>Negeri / Wilayah</label>
<input id="state" required placeholder="Negeri">
</div>
</div>

<label>Poskod</label>
<input id="postcode" required placeholder="Contoh: 14300">

<label>Kaedah Pembayaran</label>
<select id="payment" required>
<option value="">Pilih pembayaran</option>
<option value="Bank Transfer">Bank Transfer</option>
<option value="Cash On Delivery">Cash On Delivery</option>
</select>

<div class="summary">
<h3>Ringkasan Pesanan</h3>
<div id="orderDetails"></div>
<hr>
Jumlah:
<div class="total" id="totalPrice">RM0.00</div>
</div>

<button type="submit">TERUSKAN KE PAYMENT</button>
</form>

<a class="back" href="shop.html">← Kembali ke Shop</a>
</div>

<script>
const cart=JSON.parse(localStorage.getItem("nck_cart")||"[]");
let total=0;

document.getElementById("orderDetails").innerHTML =
cart.length ? cart.map(item=>{
 const subtotal=Number(item.price)*Number(item.qty);
 total+=subtotal;
 return `<p>${item.name}<br>Saiz: ${item.size}<br>Kuantiti: ${item.qty}<br>RM${subtotal.toFixed(2)}</p>`;
}).join("") : "Tiada pesanan dijumpai.";

document.getElementById("totalPrice").textContent="RM"+total.toFixed(2);

document.getElementById("checkoutForm").addEventListener("submit",function(e){
 e.preventDefault();

 if(!cart.length){
  alert("Tiada pesanan. Sila pilih produk dahulu.");
  return;
 }

 const order={
  name:document.getElementById("name").value,
  phone:document.getElementById("phone").value,
  email:document.getElementById("email").value,
  country:document.getElementById("country").value,
  street:document.getElementById("street").value,
  unit:document.getElementById("unit").value,
  city:document.getElementById("city").value,
  state:document.getElementById("state").value,
  postcode:document.getElementById("postcode").value,
  payment:document.getElementById("payment").value,
  items:cart,
  total:total,
  date:new Date().toISOString()
 };

 localStorage.setItem("nck_order",JSON.stringify(order));
 window.location.href="payment.html";
});
</script>

</body>
</html>
