
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart | NCK SHOP</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b09;color:white;font-family:Arial}
header{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #24402d}
.logo{font-size:24px;font-weight:bold;color:#39e879}
nav a{color:white;text-decoration:none;margin-left:12px}
main{max-width:850px;margin:40px auto;padding:20px}
h1{color:#39e879}
.box{background:#111a13;border:1px solid #24402d;padding:20px;border-radius:12px}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #24402d;padding:15px 0}
input{width:65px;padding:10px;background:#080b09;color:white;border:1px solid #39e879;border-radius:6px}
button,.btn{display:inline-block;padding:10px 17px;background:#0066ff;color:#ffffff;border:0;border-radius:7px;font-weight:bold;text-decoration:none;cursor:pointer}
.remove{background:#652525;color:white}
.total{font-size:22px;color:#39e879;font-weight:bold;margin:20px 0}
footer{text-align:center;color:#777;padding:25px}
</style>
</head>
<body>
<header>
<div class="logo">NCK SHOP</div>
<nav>
<a href="index.html">Home</a>
<a href="shop.html">Shop</a>
<a href="cart.html">Cart</a>
</nav>
</header>

<main>
<h1>YOUR CART</h1>
<p>Semak barang pilihan anda.</p>
<div class="box">
<div id="items"></div>
<div class="total" id="total">RM 0.00</div>
<a class="btn" href="shop.html">CONTINUE SHOPPING</a>
<a class="btn" href="checkout.html">CHECKOUT</a>
</div>
</main>

<footer>© 2026 NCK SHOP</footer>

<script>
function getCart(){
return JSON.parse(localStorage.getItem("nck_cart")||"[]");
}

function showCart(){
let cart=getCart();
let html="";
let total=0;

if(cart.length===0){
document.getElementById("items").innerHTML="<p>Your cart is empty.</p>";
document.getElementById("total").innerText="RM 0.00";
return;
}

cart.forEach((item,i)=>{
let subtotal=item.price*item.qty;
total+=subtotal;
html+=`
<div class="item">
<div>
<strong>${item.name}</strong><br>
Saiz: ${item.size}<br>
RM ${item.price.toFixed(2)}
</div>
<div>
<input type="number" min="1" value="${item.qty}"
onchange="changeQty(${i},this.value)">
<button class="remove" onclick="removeItem(${i})">X</button>
</div>
</div>`;
});

document.getElementById("items").innerHTML=html;
document.getElementById("total").innerText="RM "+total.toFixed(2);
}

function changeQty(i,value){
let cart=getCart();
cart[i].qty=Math.max(1,parseInt(value)||1);
localStorage.setItem("nck_cart",JSON.stringify(cart));
showCart();
}

function removeItem(i){
let cart=getCart();
cart.splice(i,1);
localStorage.setItem("nck_cart",JSON.stringify(cart));
showCart();
}

showCart();
</script>
</body>
</html>
